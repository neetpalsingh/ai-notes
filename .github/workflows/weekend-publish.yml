name: Weekend publish

# Publishes notes you've queued in drafts/: 2–3 per Saturday and Sunday,
# each at a random minute inside three IST time windows. Nothing is
# committed when the queue is empty.
on:
  schedule:
    # Times are UTC (IST = UTC+5:30). Windows start ~11:00, ~16:00 and ~21:00 IST.
    - cron: '30 5 * * 6,0'
    - cron: '30 10 * * 6,0'
    - cron: '30 15 * * 6,0'
  workflow_dispatch:
    inputs:
      no_delay:
        description: 'Publish right away (skip the random delay)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekend-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTHOR_NAME: Neetpal Singh
      AUTHOR_EMAIL: neetpalsingh750@gmail.com
    steps:
      - name: Decide whether this slot publishes
        id: gate
        run: |
          # The first two windows always publish; the evening window publishes half the
          # time, so each weekend day gets 2 or 3 notes.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 15 * * 6,0" ] && [ $((RANDOM % 2)) -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Skipping this evening slot."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait a random number of minutes
        if: steps.gate.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.no_delay)
        run: |
          delay=$((RANDOM % 50))
          echo "Sleeping ${delay} minutes"
          sleep $((delay * 60))

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Publish the oldest draft
        if: steps.gate.outputs.run == 'true'
        run: python scripts/publish_draft.py

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f .published_title ]; then echo "Nothing published."; exit 0; fi
          title="$(cat .published_title)"; rm .published_title
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A
          git commit -m "Note: ${title}"
          git push
